<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ARDIÇ · Türkçe site kontrolü</title><style>
*{box-sizing:border-box}body{margin:0;background:#dfdbd2;color:#151515;font:14px Arial,sans-serif}header{background:#f5f3ee;padding:14px 20px;border-bottom:1px solid #b9ad9b;display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:18px;margin:0;margin-right:auto}label{display:flex;gap:8px;align-items:center}select,button,input{min-height:40px;font:inherit}button,select{border:1px solid #9b8d76;background:white;padding:7px 12px}button{cursor:pointer}button[aria-pressed=true]{background:#171717;color:#fff}main{padding:20px 8px;overflow-x:auto}iframe{display:block;margin:auto;border:1px solid #a59a88;width:390px;max-width:none;height:820px;background:#f5f3ee;box-shadow:0 12px 40px #0002}.note{padding:10px 20px;margin:0;background:#f5f3ee;color:#625846;font-size:12px;line-height:1.6}a{color:inherit}output{min-width:58px}input[type=range]{width:120px}
</style></head><body><header><h1>ARDIÇ · Türkçe site kontrolü</h1><label>Sayfa <select id="page"><option value="/">Ana sayfa</option><option value="/works">Projeler</option><option value="/works/farmasi-boss-trip">FARMASI</option><option value="/contact">Teklif formu</option><option value="/karsilastir">Karşılaştır</option><option value="/imalat/karbon-fiber">Karbon fiber</option><option value="/imalat/epoksi-recine-dokum">Epoksi döküm</option></select></label><button type="button" data-width="390" aria-pressed="true">Telefon · 390</button><button type="button" data-width="768" aria-pressed="false">Tablet · 768</button><button type="button" data-width="1280" aria-pressed="false">Masaüstü · 1280</button><label>Genişlik <input aria-label="Önizleme genişliği" type="range" id="width" min="320" max="1440" value="390"><output id="width-value">390 px</output></label><a id="open-page" href="/" target="_blank" rel="noopener">Sayfayı aç ↗</a></header><p class="note">Bu ekran canlı siteyi seçilen genişlikte gösterir. Formu göndermek gerçek bir talep oluşturabilir.</p><main><iframe id="site-frame" title="ARDIÇ Türkçe site önizlemesi" src="/"></iframe></main><script>
const frame=document.getElementById("site-frame"),page=document.getElementById("page"),width=document.getElementById("width");
page.addEventListener("change",()=>{frame.src=page.value;document.getElementById("open-page").href=page.value});
function resize(v){frame.style.width=v+"px";width.value=v;document.getElementById("width-value").textContent=v+" px";document.querySelectorAll("[data-width]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.width===String(v))))}
width.addEventListener("input",()=>resize(width.value));document.querySelectorAll("[data-width]").forEach(b=>b.addEventListener("click",()=>resize(b.dataset.width)));
</script></body></html>
